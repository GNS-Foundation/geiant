name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # GATING job — this is what branch protection requires (required context:
  # `core (22)`). Hermetic on both packages it gates: @geiant/core is pure TS +
  # crypto + committed fixtures, and @geiant/mcp-audit's tests use a MOCKED Supabase
  # client (no network/DB) — so neither can fail intermittently. The job NAME stays
  # `core` on purpose: the required-check context is `core (22)`, so adding a package
  # here needs no branch-protection settings change (renaming the job would).
  # Protects the cgr_attestation_*_jcs.golden.json byte-parity contract (a
  # canonicalize/@noble bump that breaks JCS fails here) AND the security control in
  # @geiant/mcp-audit: revocation enforcement (#9), the middleware gates, and the
  # cert-hash regression (#10) — so a regression there blocks merge instead of
  # showing as a non-blocking annotation.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]   # root engines.node >= 22; add "24" only once it's green
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3        # match root package.json packageManager

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck @geiant/core
        run: pnpm --filter @geiant/core typecheck

      - name: Build @geiant/core
        run: pnpm --filter @geiant/core build

      - name: Test @geiant/core
        run: pnpm --filter @geiant/core test

      # @geiant/mcp-audit — gated alongside core (hermetic; mocked Supabase). Its
      # typecheck script is named `lint` (tsc --noEmit), so it can't share core's
      # `typecheck` filter — hence its own steps rather than a combined --filter.
      - name: Typecheck @geiant/mcp-audit
        run: pnpm --filter @geiant/mcp-audit lint

      - name: Test @geiant/mcp-audit
        run: pnpm --filter @geiant/mcp-audit test

  # NON-GATING full-workspace job (mirrors grafomem's DESCOPED `test-runtime`).
  # Builds/tests every package incl. packages/mcp-postgis (native gdal-async, kept
  # out of build scripts via pnpm-workspace ignoredBuiltDependencies) and apps/*,
  # which carry heavier/native deps we don't want blocking a core CGR change. Kept
  # for visibility; allowed to fail until separately hardened. Branch protection
  # gates on `core` only, never on this job.
  workspace:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Test all packages
        run: pnpm -r test

# Scheduled FULL-HISTORY secret scan (geiant is public). Mirrors grafomem.
#
# The per-PR `secret-scan` job (ci.yml) scans the full working tree at HEAD. This job scans the
# entire git HISTORY — every commit — so a secret committed and later deleted from HEAD is still
# caught. Known historical findings are filtered by a committed baseline (.gitleaks-baseline.json)
# pinned by fingerprint (commit:file:rule:startline) — NOT a path/blanket exemption. A new secret
# lands in a new commit = new fingerprint not in the baseline, so it still fails. geiant's baseline
# is currently empty (`[]`) — history holds no known dead secret.
name: secret-history-scan

on:
  schedule:
    - cron: '31 6 * * 1'   # weekly, Monday 06:31 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Full-history scan (baseline-filtered — fails only on NEW findings)
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --report-path gitleaks-history-report.json \
            --no-banner --redact --exit-code 1

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history-report.json
          if-no-files-found: ignore
